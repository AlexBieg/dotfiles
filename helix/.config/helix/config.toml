theme = 'custom'

[keys.insert]
j = { k = "normal_mode" } # Maps `jk` to exit insert mode

[keys.normal]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
X = "extend_line_up"
C-r = ":reload-all"

[keys.normal.space]
x = ':buffer-close'
m = [
  ":sh bash -c 'h=$(git blame -L%{cursor_line},%{cursor_line} --porcelain %{buffer_name} | head -1 | cut -d\" \" -f1); git log -n 1 --format=\"format:%%h (%%an: %%ar) \\\"%%s\\\"\" --no-patch $h'",
]
M = [
  ":sh bash -c 'h=$(git blame -L%{cursor_line},%{cursor_line} --porcelain %{buffer_name} | head -1 | cut -d\" \" -f1); r=$(git remote get-url origin | sed \"s/.*github.com[:/]//;s/\\.git$//\"); open \"https://github.com/$r/commit/$h\"'",
]
e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
E = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]

[keys.normal.space.o]
o = ":sh tmux send-keys -t \"$(tmux list-panes -a -F '#{pane_pid} #{pane_id}' | while read p i; do pgrep -P \"$p\" -f claude >/dev/null && { echo \"$i\"; break; }; done)\" \"@%{buffer_name}\""
l = ":sh tmux send-keys -t \"$(tmux list-panes -a -F '#{pane_pid} #{pane_id}' | while read p i; do pgrep -P \"$p\" -f claude >/dev/null && { echo \"$i\"; break; }; done)\" \"@%{buffer_name}:%{selection_line_start}-%{selection_line_end}\""
p = ":sh tmux send-keys -t \"$(tmux list-panes -a -F '#{pane_pid} #{pane_id}' | while read p i; do pgrep -P \"$p\" -f claude >/dev/null && { echo \"$i\"; break; }; done)\" \"@%{buffer_name}:%{selection_line_start}-%{selection_line_end}\" Escape \"[13;2u\" Escape \"[13;2u\" \"%{selection}\""

# pi dev integration
[keys.normal.space.i]
o = ":sh ~/.local/bin/helix-pi context %{buffer_name}"
l = ":sh ~/.local/bin/helix-pi context %{buffer_name} %{selection_line_start}-%{selection_line_end}"
p = ":sh printf '%%s' \"%{selection}\" | ~/.local/bin/helix-pi context %{buffer_name} %{selection_line_start}-%{selection_line_end}"
c = ":sh ~/.local/bin/helix-pi clear"

[editor]
bufferline = "always"
end-of-line-diagnostics = "info"
color-modes = true

[editor.cursor-shape]
insert = 'bar'
# normal = 'underline'
select = 'underline'

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
# other-lines = 'warning'
cursor-line = 'warning'

[editor.statusline]
left = ["mode", "spinner", "version-control"]
center = []
right = ["file-name", "diagnostics", "register", "position-percentage"]
separator = '=='

[editor.lsp]
display-inlay-hints = true

[editor.auto-save]
focus-lost = true

[editor.whitespace.render]
space = "all"
tab = "all"
nbsp = "all"
nnbsp = "all"
newline = "all"


[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·" 

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1
