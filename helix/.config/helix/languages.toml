[[language]]
name = "python"
language-id = "python"
auto-format = true
language-servers = ["ruff", "pyright"]
file-types = ["py", "ipynb"]
comment-token = "#"
shebangs = ["python"]

[[language]]
name = 'tsx'
language-servers = ['typescript-language-server', 'oxlint-language-server']

[[language]]
name = "bash"
file-types = ["sh", "bash", "zsh", "conf", "tmux.conf", ".tmux.conf"]

[language-server.oxlint-language-server]
command = "oxlint"
args = ['--lsp']
