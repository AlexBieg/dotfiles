set -g prefix C-a

unbind C-b

bind C-a send-prefix

set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,} %H:%M %d-%b-%y'
set -g status-left ''

set -g mouse on

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind l next-window
bind h previous-window

set -g window-active-style 'fg=default,bg=terminal'
set -g window-style 'fg=default,bg=terminal'

set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta\#,} bold double-underscore"
set -g window-status-bell-style "fg=red,nobold curly-underscore"
set -g window-status-style "fg=terminal, dim"

# Set the active pane border color (e.g., blue)
set -g pane-active-border-style fg=orange,bold

# # Set the inactive pane border color (e.g., grey)
set -g pane-border-style fg=brightblack
set -g pane-border-lines simple
set -g pane-border-indicators off
set -g pane-border-format "###P #T"
set-option -g allow-rename off
set-window-option -g automatic-rename off

set -g pane-border-status top

set -g status-position top
set -g status-style bg=default,fg=default

# split panes using | and -
bind | split-window -h
bind \\ split-window -h -c "#{pane_current_path}"
bind _ split-window -v
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

# Color stuff
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 10000

bind f resize-pane -Z
set -g renumber-windows on

bind g display-popup \
	-d "#{pane_current_path}" \
	-w 80% \
	-h 80% \
	-E "lazygit"


bind C-f display-popup \
	-d "#{pane_current_path}" \
	-w 80% \
	-h 80% \
	-E

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
